clear_calls:
  name: Anrufliste löschen
  description: Löscht alle gespeicherten eingehenden Anrufe.

sync_phonebook:
  name: Telefonbuch synchronisieren
  description: Liest alle konfigurierten FRITZ!Box-Telefonbücher neu ein.

add_contact:
  name: Kontakt hinzufügen
  description: Fügt eine Rufnummer als neuen Kontakt in ein FRITZ!Box-Telefonbuch ein.
  fields:
    name:
      name: Name
      description: Name des neuen Kontakts.
      required: true
      example: Max Mustermann
      selector:
        text:
    number:
      name: Rufnummer
      description: Rufnummer des neuen Kontakts.
      required: true
      example: "01601234567"
      selector:
        text:
    phonebook_id:
      name: Telefonbuch-ID
      description: ID des Ziel-Telefonbuchs.
      required: true
      example: 0
      selector:
        number:
          min: 0
          max: 99
          mode: box

delete_call:
  name: Einzelnen Anruf löschen
  description: Löscht genau einen gespeicherten Anruf aus FritzCallMonitor.
  fields:
    call_id:
      name: Anruf-ID
      description: Interne eindeutige ID des Anrufs.
      required: true
      selector:
        text:

sync_answering_machine:
  name: Anrufbeantworter synchronisieren
  description: Liest Anrufbeantworter und Nachrichten neu aus der FRITZ!Box ein.


delete_voicemail:
  name: AB-Nachricht löschen
  description: Löscht genau eine Sprachnachricht vom FRITZ!Box-Anrufbeantworter.
  fields:
    message_id:
      name: Nachrichten-ID
      description: Interne eindeutige ID der AB-Nachricht.
      required: true
      selector:
        text:
